<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Top navigation of the app -->
    <header class="topbar">
        <div class="logo">PROTEIN<span>.</span></div>

        <div class="date">
            Daily Nutrition
        </div>
    </header>


    <!-- Main profile section -->
    <main class="profile-section">

        <div class="intro">
            <p class="small-text">LET'S GET STARTED</p>

            <h1>Build your nutrition profile.</h1>

            <p class="description">
                Tell us a little about yourself so we can
                calculate your daily nutrition targets.
            </p>
        </div>


        <!-- Profile form -->
        <form>

            <label>Name</label>
            <input type="text" name="name" placeholder="Your name">


            <label>Age</label>
            <input type="number" name="age" placeholder="Your age">


            <label>Gender</label>
            <select name="gender">
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>


            <label>Weight</label>
            <input type="number" name="weight" placeholder="Weight in kg">


            <label>Height</label>
            <input type="number" name="height" placeholder="Height in cm">


            <label>Goal</label>
            <select name="goal">
                <option value="">Select your goal</option>
                <option value="gain">Build Muscle</option>
                <option value="maintain">Maintain Weight</option>
                <option value="lose">Lose Weight</option>
            </select>


            <button type="submit">
                Continue →
            </button>

        </form>

    </main>

</body>
</html>
