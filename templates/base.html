<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ProteinTracker{% endblock %}</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="topbar">

        <a href="/" class="brand">

        <div class="brand-icon">
    <img
        src="{{ url_for('static', filename='images/protein-logo.png') }}"
        alt="Protein Tracker logo"
    >
</div>
            <span class="logo">Protein Tracker</span>

        </a>

        <nav class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="/how-it-works" class="nav-link {% if request.path == '/how-it-works' %}active{% endif %}">
    How It Works
</a>

<a href="/features" class="nav-link {% if request.path == '/features' %}active{% endif %}">
    Features
</a>

<a href="/progress" class="nav-link {% if request.path == '/progress' %}active{% endif %}">
    Progress
</a>
        </nav>

        <div class="nav-actions">

            <a href="/login" class="login-link">Log In</a>

            <a href="/setup" class="get-started">
                Get Started
                <span>→</span>
            </a>

        </div>

    </header>

    {% block content %}
    {% endblock %}

</body>

</html>
